[project]
name = "csv-orientation-experiment"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = ["pandas", "ollama", "anthropic", "openai", "python-dotenv", "fastapi", "python-multipart", "uvicorn"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
